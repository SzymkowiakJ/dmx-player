name: Build Windows EXE
on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PySide6 python-vlc pyserial

      - name: Build EXE
        run: |
          pyinstaller --onefile dmxPlayer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmx-app
          path: dist/*
